const AC=new(window.AudioContext||window.webkitAudioContext)();
function sfx(t){if(!snd)return;try{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);const n=AC.currentTime;
({jump(){o.type='square';o.frequency.setValueAtTime(280,n);o.frequency.linearRampToValueAtTime(520,n+.1);g.gain.setValueAtTime(.12,n);g.gain.linearRampToValueAtTime(0,n+.14);o.start(n);o.stop(n+.14)},

clear(){o.type='square';[523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,n+i*.12));g.gain.setValueAtTime(.12,n);g.gain.linearRampToValueAtTime(0,n+.6);o.start(n);o.stop(n+.6)},

boom(){o.type='sawtooth';o.frequency.setValueAtTime(150,n);o.frequency.linearRampToValueAtTime(30,n+.35);g.gain.setValueAtTime(.2,n);g.gain.linearRampToValueAtTime(0,n+.4);o.start(n);o.stop(n+.4)}

let pts=[],ftx=[];
function spP(x,y,c,n=6){for(let i=0;i<n;i++)pts.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*4,l:25+Math.random()*15,ml:40,s:2+Math.random()*2,c})}
function spT(x,y,t,c='#fff'){ftx.push({x,y,t,c,l:50,vy:-1.5})}
function updPts(){pts=pts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.l--;return p.l>0});ftx=ftx.filter(f=>{f.y+=f.vy;f.l--;return f.l>0})}

// ════════════════════════════════════════
// TERRAIN - Blocks with outlines on exposed edges
// The KEY visual difference: dark border where terrain meets sky
// ════════════════════════════════════════
const BIO={
  desert:{b:'#E0BD68',s:'#D6B360',e:'#C8A450',ol:'#A08030'},
  town:  {b:'#D0A858',s:'#C69E50',e:'#B28A40',ol:'#907020'},
  grey:  {b:'#C0C0B0',s:'#B0B0A0',e:'#9C9C92',ol:'#808070'},
  red:   {b:'#D09060',s:'#C68555',e:'#B27040',ol:'#905830'},
  green: {b:'#78C060',s:'#6CB858',e:'#58A848',ol:'#408830'},
  cave:  {b:'#D8C060',s:'#D0B858',e:'#C0A848',ol:'#A09030'},
  stone: {b:'#A8A898',s:'#9C9C8C',e:'#848474',ol:'#686860'},
  plains:{b:'#D8D0B0',s:'#D0C8A8',e:'#C0B898',ol:'#A0A080'}
};
let biome='desert';

// Draw terrain block with horizontal stripes + DARK OUTLINE on exposed edges
function drawTerrain(grid,pw,ph,camx,camy){
  const c=BIO[biome];
  const sx=Math.max(0,Math.floor(camx/T)-1),ex=Math.min(pw,Math.ceil((camx+800)/T)+1);
  const sy=Math.max(0,Math.floor(camy/T)-1),ey=Math.min(ph,Math.ceil((camy+600)/T)+1);

  // First pass: fill all terrain tiles with base color + stripes
  for(let ty=sy;ty<ey;ty++){
    for(let tx=sx;tx<ex;tx++){
      if(!grid[ty]||!grid[ty][tx])continue;
      const px=tx*T,py=ty*T;
      // Base fill
      X.fillStyle=c.b;X.fillRect(px,py,T,T);
      // Horizontal stripes every 5-6px
      X.fillStyle=c.s;
      for(let y=py+5;y<py+T;y+=6)X.fillRect(px,y,T,1);
    }
  }

  // Second pass: draw dark outlines on exposed edges (where terrain meets air)
  for(let ty=sy;ty<ey;ty++){
    for(let tx=sx;tx<ex;tx++){
      if(!grid[ty]||!grid[ty][tx])continue;
      const px=tx*T,py=ty*T;
      const above=ty>0&&grid[ty-1]?grid[ty-1][tx]:0;
      const below=ty<ph-1&&grid[ty+1]?grid[ty+1][tx]:0;
      const left=tx>0?grid[ty][tx-1]:0;
      const right=tx<pw-1?grid[ty][tx+1]:0;

      X.fillStyle=c.ol;
      // Top edge outline (most important - where terrain meets sky)
      if(!above){X.fillRect(px,py,T,2);
        // Slightly darker top-edge accent
        X.fillStyle=c.e;X.fillRect(px,py+2,T,1);X.fillStyle=c.ol;}
      // Left edge
      if(!left)X.fillRect(px,py,2,T);
      // Right edge
      if(!right)X.fillRect(px+T-2,py,2,T);
      // Bottom edge
      if(!below)X.fillRect(px,py+T-2,T,2);

      // Green biome gets diagonal hatching
      if(biome==='green'){
        X.strokeStyle='rgba(80,160,60,0.12)';X.lineWidth=1;
        X.beginPath();X.moveTo(px,py+T);X.lineTo(px+T,py);X.stroke();
        X.beginPath();X.moveTo(px+T/2,py+T);X.lineTo(px+T,py+T/2);X.stroke();
        X.beginPath();X.moveTo(px,py+T/2);X.lineTo(px+T/2,py);X.stroke();
      }
    }
  }
}

// Wooden crate (X pattern, from the video)
function drawCrate(x,y){
  X.fillStyle='#C8B078';X.fillRect(x+1,y+1,T-2,T-2);
  X.fillStyle='#B8A068';X.fillRect(x,y,T,2);X.fillRect(x,y+T-2,T,2);X.fillRect(x,y,2,T);X.fillRect(x+T-2,y,2,T);
  // X pattern
  X.fillStyle='#A89058';
  X.fillRect(x+4,y+4,2,2);X.fillRect(x+6,y+6,2,2);X.fillRect(x+8,y+8,2,2);X.fillRect(x+10,y+10,2,2);
  X.fillRect(x+12,y+12,2,2);X.fillRect(x+14,y+14,2,2);X.fillRect(x+16,y+16,2,2);X.fillRect(x+18,y+18,2,2);
  X.fillRect(x+20,y+20,2,2);X.fillRect(x+22,y+22,2,2);X.fillRect(x+24,y+24,2,2);
  X.fillRect(x+24,y+4,2,2);X.fillRect(x+22,y+6,2,2);X.fillRect(x+20,y+8,2,2);X.fillRect(x+18,y+10,2,2);
  X.fillRect(x+16,y+12,2,2);X.fillRect(x+14,y+14,2,2);X.fillRect(x+12,y+16,2,2);X.fillRect(x+10,y+18,2,2);
  X.fillRect(x+8,y+20,2,2);X.fillRect(x+6,y+22,2,2);X.fillRect(x+4,y+24,2,2);
  // Corner brackets
  X.fillStyle='#907840';X.fillRect(x+2,y+2,6,2);X.fillRect(x+2,y+2,2,6);
  X.fillRect(x+T-8,y+2,6,2);X.fillRect(x+T-4,y+2,2,6);
  X.fillRect(x+2,y+T-4,6,2);X.fillRect(x+2,y+T-8,2,6);
  X.fillRect(x+T-8,y+T-4,6,2);X.fillRect(x+T-4,y+T-8,2,6);
}

// Thin bridge platform
function drawBridge(x,y,w){
  X.fillStyle='#A08050';X.fillRect(x,y,w,4);

// Building wall background
function drawWall(x,y,w,h,color='#D0A858'){

  X.fillStyle='#70AACC';X.fillRect(x+2,y+2,w/2-3,h/2-3);X.fillRect(x+w/2+1,y+2,w/2-3,h/2-3);
  X.fillRect(x+2,y+h/2+1,w/2-3,h/2-3);X.fillRect(x+w/2+1,y+h/2+1,w/2-3,h/2-3);
  X.fillStyle='#8B6830';X.fillRect(x+w/2-1,y,2,h);X.fillRect(x,y+h/2-1,w,2);
}
function drawSmallDoor(x,y){X.fillStyle='#5D4037';X.fillRect(x,y,22,30);X.fillStyle='#8B7355';X.fillRect(x+2,y+2,18,26);X.fillStyle='#FFD700';X.fillRect(x+15,y+14,2,2)}

function drawPig(x,y,dir,frame,grnd){
  const bob=grnd&&Math.abs(P.vx)>.3?Math.sin(frame*.35):0;const ry=Math.round(y+bob);
  X.save();if(dir<0){X.translate(x+16,0);X.scale(-1,1);X.translate(-x-16,0)}
  const ol='#604020',bd='#E0C898',lt='#E8D0A8',dk='#C8A878';
  const la=grnd&&Math.abs(P.vx)>.3?Math.sin(frame*.5)*2:0;
  // Body
  X.fillStyle=ol;X.fillRect(x+3,ry+10,23,14);
  X.fillStyle=bd;X.fillRect(x+4,ry+11,21,12);
  X.fillStyle=lt;X.fillRect(x+5,ry+12,17,5);
  X.fillStyle=dk;X.fillRect(x+5,ry+19,17,3);
  // Head
  X.fillStyle=ol;X.fillRect(x+17,ry+4,13,13);
  X.fillStyle=bd;X.fillRect(x+18,ry+5,11,11);
  X.fillStyle=lt;X.fillRect(x+19,ry+6,8,4);
  // Ears
  X.fillStyle=ol;X.fillRect(x+19,ry+1,4,4);X.fillRect(x+25,ry+1,4,4);
  X.fillStyle=dk;X.fillRect(x+20,ry+2,2,2);X.fillRect(x+26,ry+2,2,2);
  // Eye
  X.fillStyle='#000';X.fillRect(x+24,ry+8,2,2);
  // Snout
  X.fillStyle='#D8B888';X.fillRect(x+27,ry+10,3,3);X.fillStyle=ol;X.fillRect(x+28,ry+11,1,1);
  // Legs
  X.fillStyle=ol;
  X.fillRect(x+6,ry+23,4,5);X.fillRect(x+12+la,ry+23,4,5);X.fillRect(x+18,ry+23,4,5);X.fillRect(x+23-la,ry+23,4,5);
  X.fillStyle='#402010';X.fillRect(x+6,ry+27,4,1);X.fillRect(x+12+la,ry+27,4,1);X.fillRect(x+18,ry+27,4,1);X.fillRect(x+23-la,ry+27,4,1);
  // Tail
  X.fillStyle=ol;X.fillRect(x+1,ry+12,3,1);X.fillRect(x,ry+11,2,1);X.fillRect(x+1,ry+10,3,1);
  X.restore();
}

function drawFrog(x,y,frame,dir){
  const bob=Math.sin(frame*.06);const ry=Math.round(y+bob);
  X.save();if(dir<0){X.translate(x+16,0);X.scale(-1,1);X.translate(-x-16,0)}
  // Body with outline
  X.fillStyle='#2D6D20';X.fillRect(x+3,ry+11,26,16);
  X.fillStyle='#4A9E3A';X.fillRect(x+4,ry+12,24,14);
  X.fillStyle='#5AB84A';X.fillRect(x+6,ry+14,20,8);
  // Head
  X.fillStyle='#4A9E3A';X.fillRect(x+8,ry+6,18,10);
  // Big white eyes with outline
  X.fillStyle='#2D6D20';X.fillRect(x+9,ry+1,8,8);X.fillRect(x+18,ry+1,8,8);
  X.fillStyle='#fff';X.fillRect(x+10,ry+2,6,6);X.fillRect(x+19,ry+2,6,6);
  X.fillStyle='#000';X.fillRect(x+13,ry+4,2,3);X.fillRect(x+22,ry+4,2,3);
  // Mouth line
  X.fillStyle='#2D6D20';X.fillRect(x+12,ry+14,10,1);
  // Legs
  const la=Math.sin(frame*.08)*1.5;X.fillStyle='#3E8E30';
  X.fillRect(x+1,ry+22+la,9,6);X.fillRect(x+22,ry+22-la,9,6);
  X.fillStyle='#2D6D20';X.fillRect(x,ry+26+la,6,2);X.fillRect(x+26,ry+26-la,6,2);
  X.restore();
}

function drawSnake(x,y,frame,dir){
  X.save();if(dir<0){X.translate(x+28,0);X.scale(-1,1);X.translate(-x-28,0)}
  // Thicker snake body with outline
  for(let i=0;i<10;i++){
    const sy=Math.sin(frame*.07+i*.6)*4;
    X.fillStyle='#1B5E20';X.fillRect(x+i*5-1,y+11+sy,8,13);
    X.fillStyle=i%2?'#2D862D':'#3E9E3E';X.fillRect(x+i*5,y+12+sy,6,11);
    X.fillStyle='#7AC87A';X.fillRect(x+i*5+1,y+19+sy,4,3);
  }
  // Head
  X.fillStyle='#1B5E20';X.fillRect(x+47,y+5,16,20);
  X.fillStyle='#3E9E3E';X.fillRect(x+48,y+6,14,18);
  X.fillStyle='#FFE040';X.fillRect(x+52,y+8,5,5);X.fillStyle='#000';X.fillRect(x+54,y+10,3,3);
  if(Math.sin(frame*.1)>.2){X.fillStyle='#E53935';X.fillRect(x+62,y+16,6,2);X.fillRect(x+66,y+14,2,2);X.fillRect(x+66,y+18,2,2)}
  X.restore();
}

// Bubble - MUCH bigger, with swirl/face pattern like the original
function drawBubble(x,y,frame){
  const bob=Math.sin(frame*.03+x*.08)*8,ry=y+bob;
  const cx2=x+16,cy=ry+16;
  // Outer circle
  X.strokeStyle='rgba(100,160,200,0.4)';X.lineWidth=2;X.beginPath();X.arc(cx2,cy,15,0,Math.PI*2);X.stroke();
  // Fill
  X.fillStyle='rgba(180,220,250,0.35)';X.beginPath();X.arc(cx2,cy,14,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(210,240,255,0.4)';X.beginPath();X.arc(cx2,cy,11,0,Math.PI*2);X.fill();
  // Shine highlight
  X.fillStyle='rgba(255,255,255,0.7)';X.fillRect(cx2-6,cy-7,5,4);
  // Swirl face pattern (yin-yang style from video)
  X.fillStyle='rgba(80,130,170,0.3)';
  X.beginPath();X.arc(cx2-3,cy,4,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(200,230,255,0.5)';
  X.beginPath();X.arc(cx2+3,cy,4,0,Math.PI*2);X.fill();
  // Eyes
  X.fillStyle='rgba(60,100,140,0.4)';X.fillRect(cx2-5,cy-3,3,2);X.fillRect(cx2+3,cy-3,3,2);
}

// Blue gem crystal
function drawGem(x,y,frame){
  const bob=Math.sin(frame*.07+x*.05)*3,ry=y+bob;

  X.fillStyle='#1A4466';
  X.fillRect(x+11,ry,10,2);X.fillRect(x+9,ry+2,14,2);X.fillRect(x+7,ry+4,18,22);X.fillRect(x+9,ry+26,14,2);X.fillRect(x+11,ry+28,10,2);
  // Fill
  X.fillStyle='#336699';X.fillRect(x+9,ry+2,14,26);
  X.fillStyle='#4488CC';X.fillRect(x+10,ry+4,12,20);
  X.fillStyle='#5599DD';X.fillRect(x+12,ry+6,8,14);
  // Shine
  X.fillStyle='#AAD4FF';X.fillRect(x+12,ry+6,3,6);
  X.fillStyle='#CCEEFF';X.fillRect(x+12,ry+7,2,3);
}

  X.fillStyle='#B8860B';X.fillRect(x+10,ry+8,3,3);
  X.fillStyle='#FFD700';X.fillRect(x+14,ry+10,12,3);X.fillStyle='#FFC107';X.fillRect(x+22,ry+13,3,3);X.fillRect(x+18,ry+13,3,3);

// Decorations - more detailed to match video

  X.fillStyle='#3E9E3E';X.fillRect(x+20,y-31,11,7);X.fillRect(x+26,y-41,7,12);
  X.fillStyle='#4DB84D';X.fillRect(x+28,y-39,3,14);
}

function drawBush(x,y){

function solid2(wx,wy){const tx=Math.floor(wx/T),ty=Math.floor(wy/T);if(tx<0||tx>=LV.pw||ty<0||ty>=LV.ph)return 0;return LV.grid[ty][tx]>0}
function rOvr(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function updPlayer(){
  if(P.dead)return;const sp=inp.ShiftLeft||inp.ShiftRight?WS:RS;
  if(inp.ArrowLeft){P.vx=-sp;P.dir=-1;P.fr++}else if(inp.ArrowRight){P.vx=sp;P.dir=1;P.fr++}else{P.vx*=.7;if(Math.abs(P.vx)<.1)P.vx=0}
  if((inp.ArrowUp||inp.Space)&&P.gnd){P.vy=JF;P.gnd=false;sfx('jump')}
  P.vy+=GR;if(P.vy>12)P.vy=12;const m=4,nx=P.x+P.vx;
  if(P.vx<0){if(solid2(nx+m,P.y+4)||solid2(nx+m,P.y+P.h-4)){P.x=Math.floor((nx+m)/T)*T+T-m;P.vx=0}else P.x=nx}
  else if(P.vx>0){if(solid2(nx+P.w-m,P.y+4)||solid2(nx+P.w-m,P.y+P.h-4)){P.x=Math.floor((nx+P.w-m)/T)*T-P.w+m;P.vx=0}else P.x=nx}
  const ny=P.y+P.vy;P.gnd=false;
  if(P.vy>0){if(solid2(P.x+m,ny+P.h)||solid2(P.x+P.w-m,ny+P.h)){P.y=Math.floor((ny+P.h)/T)*T-P.h;P.vy=0;P.gnd=true}else P.y=ny}
  else if(P.vy<0){if(solid2(P.x+m,ny)||solid2(P.x+P.w-m,ny)){P.y=Math.floor(ny/T)*T+T;P.vy=0}else P.y=ny}
  if(P.y>LV.ph*T+64)pDie();if(P.inv>0)P.inv--;tf++;if(tf>=60){tf=0;gt--;if(gt<=0)pDie()}
}
function pHit(){if(P.inv>0)return;hp--;P.inv=90;sht=12;shi=4;sfx('hurt');if(hp<=0)pDie()}

function updEnts(){

  LV.ents.forEach(e=>{
    if(e.alive&&(e.type==='frog'||e.type==='snake')){
      const sp=e.type==='snake'?1.5:.8;e.x+=e.dir*sp/T;if(e.x<=e.startX){e.x=e.startX;e.dir=1}if(e.x>=e.endX){e.x=e.endX;e.dir=-1}

  });
}
