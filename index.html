<body>
<div id="gc"><canvas id="g" width="800" height="600"></canvas></div>
<script>
const C=document.getElementById('g'),X=C.getContext('2d');
X.imageSmoothingEnabled=false;
const T=32,GR=0.55,JF=-11,RS=3.5,WS=1.5;

let gs='title',cl=0,lives=5,score=0,gems=0,keys=0,hp=4,mhp=4,lit=0,snd=true,fc=0,sht=0,shi=0,gt=300,tf=0;
let bossHp=0,bossMax=3,bootY=0,bootState='up',bootTimer=0;
const inp={};
document.addEventListener('keydown',e=>{inp[e.code]=true;if(e.code==='KeyP'){if(gs==='play')gs='pause';else if(gs==='pause')gs='play'}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});
document.addEventListener('keyup',e=>{inp[e.code]=false});
C.addEventListener('click',onClick);

// Audio
const AC=new(window.AudioContext||window.webkitAudioContext)();
function sfx(t){if(!snd)return;try{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);const n=AC.currentTime;
({jump(){o.type='square';o.frequency.setValueAtTime(280,n);o.frequency.linearRampToValueAtTime(520,n+.1);g.gain.setValueAtTime(.12,n);g.gain.linearRampToValueAtTime(0,n+.14);o.start(n);o.stop(n+.14)},
gem(){o.type='square';o.frequency.setValueAtTime(880,n);o.frequency.setValueAtTime(1100,n+.04);g.gain.setValueAtTime(.1,n);g.gain.linearRampToValueAtTime(0,n+.1);o.start(n);o.stop(n+.1)},
stomp(){o.type='sawtooth';o.frequency.setValueAtTime(300,n);o.frequency.linearRampToValueAtTime(80,n+.12);g.gain.setValueAtTime(.15,n);g.gain.linearRampToValueAtTime(0,n+.18);o.start(n);o.stop(n+.18)},
hurt(){o.type='sawtooth';o.frequency.setValueAtTime(200,n);o.frequency.linearRampToValueAtTime(80,n+.25);g.gain.setValueAtTime(.15,n);g.gain.linearRampToValueAtTime(0,n+.3);o.start(n);o.stop(n+.3)},
key(){o.type='square';o.frequency.setValueAtTime(600,n);o.frequency.setValueAtTime(800,n+.08);o.frequency.setValueAtTime(1000,n+.16);g.gain.setValueAtTime(.1,n);g.gain.linearRampToValueAtTime(0,n+.25);o.start(n);o.stop(n+.25)},
clear(){o.type='square';[523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,n+i*.12));g.gain.setValueAtTime(.12,n);g.gain.linearRampToValueAtTime(0,n+.6);o.start(n);o.stop(n+.6)},
die(){o.type='square';o.frequency.setValueAtTime(400,n);o.frequency.linearRampToValueAtTime(100,n+.5);g.gain.setValueAtTime(.15,n);g.gain.linearRampToValueAtTime(0,n+.6);o.start(n);o.stop(n+.6)},
sel(){o.type='square';o.frequency.setValueAtTime(600,n);o.frequency.setValueAtTime(800,n+.04);g.gain.setValueAtTime(.08,n);g.gain.linearRampToValueAtTime(0,n+.08);o.start(n);o.stop(n+.08)},
boom(){o.type='sawtooth';o.frequency.setValueAtTime(150,n);o.frequency.linearRampToValueAtTime(30,n+.35);g.gain.setValueAtTime(.2,n);g.gain.linearRampToValueAtTime(0,n+.4);o.start(n);o.stop(n+.4)},
splash(){o.type='triangle';o.frequency.setValueAtTime(200,n);o.frequency.linearRampToValueAtTime(80,n+.3);g.gain.setValueAtTime(.15,n);g.gain.linearRampToValueAtTime(0,n+.35);o.start(n);o.stop(n+.35)},
boss(){o.type='sawtooth';o.frequency.setValueAtTime(80,n);o.frequency.linearRampToValueAtTime(40,n+.4);g.gain.setValueAtTime(.25,n);g.gain.linearRampToValueAtTime(0,n+.5);o.start(n);o.stop(n+.5)}
})[t]?.()}catch(e){}}

let pts=[],ftx=[],grenades=[];
function spP(x,y,c,n=6){for(let i=0;i<n;i++)pts.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*4,l:25+Math.random()*15,ml:40,s:2+Math.random()*2,c})}
function spT(x,y,t,c='#fff'){ftx.push({x,y,t,c,l:50,vy:-1.5})}
function updPts(){pts=pts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.l--;return p.l>0});ftx=ftx.filter(f=>{f.y+=f.vy;f.l--;return f.l>0})}

// ═══════════════════ BIOMES ═══════════════════
const BIO={
  desert:{b:'#E0BD68',s:'#D6B360',e:'#C8A450',ol:'#A08030'},
  town:{b:'#D0A858',s:'#C69E50',e:'#B28A40',ol:'#907020'},
  grey:{b:'#C0C0B0',s:'#B0B0A0',e:'#9C9C92',ol:'#808070'},
  red:{b:'#D09060',s:'#C68555',e:'#B27040',ol:'#905830'},
  green:{b:'#78C060',s:'#6CB858',e:'#58A848',ol:'#408830'},
  cave:{b:'#D8C060',s:'#D0B858',e:'#C0A848',ol:'#A09030'},
  stone:{b:'#A8A898',s:'#9C9C8C',e:'#848474',ol:'#686860'},
  plains:{b:'#D8D0B0',s:'#D0C8A8',e:'#C0B898',ol:'#A0A080'},
  water:{b:'#5090C0',s:'#4888B8',e:'#4080B0',ol:'#3070A0'}
};
let biome='desert';

// Terrain: rendered ONCE to offscreen canvas, then blitted each frame
let terrainCache=null,terrainDirty=true;
function buildTerrainCache(grid,pw,ph){
  const tc=document.createElement('canvas');tc.width=pw*T;tc.height=ph*T;
  const tx=tc.getContext('2d');tx.imageSmoothingEnabled=false;
  const c=BIO[biome];
  for(let ty=0;ty<ph;ty++)for(let txx=0;txx<pw;txx++){
    if(!grid[ty]||!grid[ty][txx])continue;
    const px=txx*T,py=ty*T;
    tx.fillStyle=c.b;tx.fillRect(px,py,T,T);
    tx.fillStyle=c.s;for(let y=py+5;y<py+T;y+=6)tx.fillRect(px,y,T,1);
    if(biome==='green'){tx.strokeStyle='rgba(80,160,60,0.12)';tx.lineWidth=1;tx.beginPath();tx.moveTo(px,py+T);tx.lineTo(px+T,py);tx.stroke();tx.beginPath();tx.moveTo(px+T/2,py+T);tx.lineTo(px+T,py+T/2);tx.stroke()}
    // Outlines on exposed edges
    const above=ty>0&&grid[ty-1]?grid[ty-1][txx]:0,below=ty<ph-1&&grid[ty+1]?grid[ty+1][txx]:0;
    const left=txx>0?grid[ty][txx-1]:0,right=txx<pw-1?grid[ty][txx+1]:0;
    tx.fillStyle=c.ol;
    if(!above){tx.fillRect(px,py,T,2);tx.fillStyle=c.e;tx.fillRect(px,py+2,T,1);tx.fillStyle=c.ol}
    if(!left)tx.fillRect(px,py,2,T);if(!right)tx.fillRect(px+T-2,py,2,T);if(!below)tx.fillRect(px,py+T-2,T,2);
  }
  return tc;
}
function drawTerrain(grid,pw,ph,cx,cy){
  if(terrainDirty||!terrainCache){terrainCache=buildTerrainCache(grid,pw,ph);terrainDirty=false}
  // Blit only the visible portion
  const sx=Math.max(0,Math.floor(cx)),sy=Math.max(0,Math.floor(cy));
  const sw=Math.min(800,terrainCache.width-sx),sh=Math.min(600,terrainCache.height-sy);
  if(sw>0&&sh>0)X.drawImage(terrainCache,sx,sy,sw,sh,sx,sy,sw,sh);
}

// ═══════════════════ SPRITES ═══════════════════
function drawPig(x,y,dir,frame,grnd){
  const bob=grnd&&Math.abs(P.vx)>.3?Math.sin(frame*.35):0;const ry=Math.round(y+bob);
  X.save();if(dir<0){X.translate(x+16,0);X.scale(-1,1);X.translate(-x-16,0)}
  const ol='#604020',bd='#E0C898',lt='#E8D0A8',dk='#C8A878';
  const la=grnd&&Math.abs(P.vx)>.3?Math.sin(frame*.5)*2:0;
  X.fillStyle=ol;X.fillRect(x+3,ry+10,23,14);X.fillStyle=bd;X.fillRect(x+4,ry+11,21,12);X.fillStyle=lt;X.fillRect(x+5,ry+12,17,5);X.fillStyle=dk;X.fillRect(x+5,ry+19,17,3);
  X.fillStyle=ol;X.fillRect(x+17,ry+4,13,13);X.fillStyle=bd;X.fillRect(x+18,ry+5,11,11);X.fillStyle=lt;X.fillRect(x+19,ry+6,8,4);
  X.fillStyle=ol;X.fillRect(x+19,ry+1,4,4);X.fillRect(x+25,ry+1,4,4);X.fillStyle=dk;X.fillRect(x+20,ry+2,2,2);X.fillRect(x+26,ry+2,2,2);
  X.fillStyle='#000';X.fillRect(x+24,ry+8,2,2);X.fillStyle='#D8B888';X.fillRect(x+27,ry+10,3,3);X.fillStyle=ol;X.fillRect(x+28,ry+11,1,1);
  X.fillStyle=ol;X.fillRect(x+6,ry+23,4,5);X.fillRect(x+12+la,ry+23,4,5);X.fillRect(x+18,ry+23,4,5);X.fillRect(x+23-la,ry+23,4,5);
  X.fillStyle='#402010';X.fillRect(x+6,ry+27,4,1);X.fillRect(x+12+la,ry+27,4,1);X.fillRect(x+18,ry+27,4,1);X.fillRect(x+23-la,ry+27,4,1);
  X.fillStyle=ol;X.fillRect(x+1,ry+12,3,1);X.fillRect(x,ry+11,2,1);X.fillRect(x+1,ry+10,3,1);
  X.restore();
}

function drawFrog(x,y,f,d){
  const b=Math.sin(f*.06),ry=Math.round(y+b);X.save();if(d<0){X.translate(x+16,0);X.scale(-1,1);X.translate(-x-16,0)}
  X.fillStyle='#2D6D20';X.fillRect(x+3,ry+11,26,16);X.fillStyle='#4A9E3A';X.fillRect(x+4,ry+12,24,14);X.fillStyle='#5AB84A';X.fillRect(x+6,ry+14,20,8);
  X.fillStyle='#4A9E3A';X.fillRect(x+8,ry+6,18,10);
  X.fillStyle='#2D6D20';X.fillRect(x+9,ry+1,8,8);X.fillRect(x+18,ry+1,8,8);X.fillStyle='#fff';X.fillRect(x+10,ry+2,6,6);X.fillRect(x+19,ry+2,6,6);
  X.fillStyle='#000';X.fillRect(x+13,ry+4,2,3);X.fillRect(x+22,ry+4,2,3);
  const la=Math.sin(f*.08)*1.5;X.fillStyle='#3E8E30';X.fillRect(x+1,ry+22+la,9,6);X.fillRect(x+22,ry+22-la,9,6);
  X.restore();
}

function drawSnake(x,y,f,d){
  // BIG snake - thick coiling body curving up to raised head (2x pig size)
  X.save();if(d<0){X.translate(x+40,0);X.scale(-1,1);X.translate(-x-40,0)}
  const ol='#1B5E20',c1='#3E9E3E',c2='#2D862D',hi='#5AB84A',bl='#7AC87A';
  // Thick coiling body segments on ground
  for(let i=0;i<7;i++){
    const sy=Math.sin(f*.06+i*.5)*3;
    X.fillStyle=ol;X.fillRect(x+i*8-1,y+10+sy,12,20);
    X.fillStyle=i%2?c2:c1;X.fillRect(x+i*8,y+11+sy,10,18);
    X.fillStyle=bl;X.fillRect(x+i*8+2,y+23+sy,6,4);
  }
  // Body curves UP (the distinctive raised section)
  X.fillStyle=ol;X.fillRect(x+54,y-6,14,38);
  X.fillStyle=c1;X.fillRect(x+55,y-5,12,36);
  X.fillStyle=hi;X.fillRect(x+57,y-3,4,30);
  // Neck going up
  X.fillStyle=ol;X.fillRect(x+52,y-22,16,20);
  X.fillStyle=c1;X.fillRect(x+53,y-21,14,18);
  X.fillStyle=hi;X.fillRect(x+55,y-19,4,14);
  // Head (big, at top of raised body)
  X.fillStyle=ol;X.fillRect(x+48,y-36,22,18);
  X.fillStyle=c1;X.fillRect(x+49,y-35,20,16);
  X.fillStyle=c2;X.fillRect(x+49,y-35,20,3);
  // Eye (large, yellow)
  X.fillStyle='#FFE040';X.fillRect(x+56,y-32,6,6);
  X.fillStyle='#000';X.fillRect(x+58,y-30,3,4);
  // Mouth
  X.fillStyle=ol;X.fillRect(x+54,y-22,14,2);
  // Tongue
  if(Math.sin(f*.1)>.2){X.fillStyle='#E53935';X.fillRect(x+70,y-28,8,2);X.fillRect(x+76,y-30,2,2);X.fillRect(x+76,y-26,2,2)}
  X.restore();
}

// NEW: Criminal/Bandit enemy - walks, throws grenades
function drawBandit(x,y,f,d){
  const b=Math.sin(f*.06);const ry=Math.round(y+b);
  X.save();if(d<0){X.translate(x+16,0);X.scale(-1,1);X.translate(-x-16,0)}
  // Body (dark vest)
  X.fillStyle='#2A2A2A';X.fillRect(x+6,ry+8,20,16);X.fillStyle='#3A3A3A';X.fillRect(x+8,ry+10,16,12);
  // Head
  X.fillStyle='#D4A060';X.fillRect(x+8,ry+0,16,12);X.fillStyle='#C09050';X.fillRect(x+10,ry+2,12,8);
  // Hat (dark brown cowboy)
  X.fillStyle='#3A2810';X.fillRect(x+4,ry-2,24,4);X.fillStyle='#4A3818';X.fillRect(x+8,ry-6,16,5);
  // Eyes (mean)
  X.fillStyle='#000';X.fillRect(x+12,ry+4,2,2);X.fillRect(x+18,ry+4,2,2);
  // Bandana (red)
  X.fillStyle='#AA2020';X.fillRect(x+10,ry+7,12,3);
  // Legs
  const la=Math.sin(f*.1)*2;
  X.fillStyle='#4A3818';X.fillRect(x+8+la,ry+24,6,5);X.fillRect(x+18-la,ry+24,6,5);
  // Arm holding grenade
  X.fillStyle='#D4A060';X.fillRect(x+22,ry+10,6,4);
  // Grenade in hand
  X.fillStyle='#333';X.beginPath();X.arc(x+28,ry+12,3,0,Math.PI*2);X.fill();
  X.restore();
}

// NEW: Rolling boulder
function drawBoulder(x,y,r){
  // Square approximation - much faster than arc
  X.fillStyle='#777';X.fillRect(x-r,y-r+2,r*2,r*2-4);X.fillRect(x-r+2,y-r,r*2-4,r*2);
  X.fillStyle='#999';X.fillRect(x-r+3,y-r+3,r*2-6,r*2-6);
  X.fillStyle='#BBB';X.fillRect(x-r*.4,y-r*.4,r*.5,r*.5);
}

// NEW: Bird enemy (flies in sine wave)
function drawBird(x,y,f){
  X.fillStyle='#3A8030';X.fillRect(x+4,y+6,14,8);// body
  X.fillStyle='#4A9E3A';X.fillRect(x+14,y+4,8,6);// head
  X.fillStyle='#000';X.fillRect(x+18,y+6,2,2);// eye
  X.fillStyle='#FF8800';X.fillRect(x+22,y+8,4,2);// beak
  // Wings flapping
  const wing=Math.sin(f*.2)*4;
  X.fillStyle='#3A8030';X.fillRect(x+6,y+2+wing,10,4);X.fillRect(x+6,y+14-wing,10,4);
}

// Grenade projectile
function drawGrenade(x,y){
  X.fillStyle='#333';X.beginPath();X.arc(x,y,4,0,Math.PI*2);X.fill();
  X.fillStyle='#555';X.beginPath();X.arc(x-1,y-1,2,0,Math.PI*2);X.fill();
  // Fuse spark
  if(fc%4<2){X.fillStyle='#FFD700';X.fillRect(x-1,y-6,2,3)}
}

// Boss machine - steel boot
// Boss: a hopping metal boot mech with villain riding on top
// bossX, bossY track the boot's world position; bootState controls AI
let bossX=0,bossY=0,bossVx=0,bossVy=0,bossGnd=false,bossDir=1;
function drawBoss(){
  const x=bossX,y=bossY;
  // Steel boot body (big rectangle)
  X.fillStyle='#555';X.fillRect(x-24,y-40,48,40);
  X.fillStyle='#666';X.fillRect(x-22,y-38,44,36);
  X.fillStyle='#777';X.fillRect(x-20,y-36,40,28);
  // Boot toe (extends forward based on direction)
  X.fillStyle='#555';X.fillRect(x-30,y-12,60,14);
  X.fillStyle='#666';X.fillRect(x-28,y-10,56,10);
  // SPIKES on bottom!
  X.fillStyle='#333';
  for(let i=0;i<6;i++){X.fillRect(x-26+i*10,y+2,4,8);X.fillRect(x-25+i*10,y+6,2,6)}
  X.fillStyle='#444';X.fillRect(x-30,y-2,60,4);
  // Rivets
  X.fillStyle='#888';X.fillRect(x-18,y-34,4,4);X.fillRect(x+14,y-34,4,4);X.fillRect(x-18,y-16,4,4);X.fillRect(x+14,y-16,4,4);
  // Villain riding on top (head + hat poking out)
  X.fillStyle='#D4A060';X.fillRect(x-6,y-52,12,12);// head
  X.fillStyle='#3A2810';X.fillRect(x-10,y-56,20,5);X.fillRect(x-6,y-60,12,5);// hat
  X.fillStyle='#000';X.fillRect(x-3,y-48,2,2);X.fillRect(x+3,y-48,2,2);// eyes
  X.fillStyle='#AA2020';X.fillRect(x-4,y-44,8,2);// angry mouth
  // HP bar above
  X.fillStyle='#333';X.fillRect(x-30,y-68,60,6);
  X.fillStyle='#E53935';X.fillRect(x-28,y-66,56*(bossHp/bossMax),3);
  // "BOSS" label
  X.fillStyle='#fff';X.font='6px "Press Start 2P",monospace';X.fillText('BOSS',x-12,y-70);
}

// Water surface
function drawWater(waterY,cx){
  X.fillStyle='rgba(40,100,180,0.7)';X.fillRect(0,waterY,800,600-waterY);
  // Simplified waves - fewer segments
  X.fillStyle='rgba(60,140,220,0.5)';
  for(let x2=0;x2<820;x2+=40){const wy=waterY+Math.sin((x2+cx)*.02+fc*.05)*4;X.fillRect(x2,wy,40,600-wy)}
  X.fillStyle='rgba(255,255,255,0.6)';
  for(let x2=0;x2<820;x2+=60){const wy=waterY+Math.sin((x2+cx)*.02+fc*.05)*4-2;X.fillRect(x2+8,wy,16,3)}
}

function drawBubble(x,y,f){
  const b=Math.sin(f*.03+x*.08)*8,ry=y+b,cx2=x+16,cy=ry+16;
  // Simplified bubble - fewer draw calls
  X.fillStyle='rgba(180,220,250,0.35)';X.fillRect(cx2-14,cy-14,28,28);
  X.fillStyle='rgba(210,240,255,0.45)';X.fillRect(cx2-11,cy-11,22,22);
  X.fillStyle='rgba(255,255,255,0.6)';X.fillRect(cx2-6,cy-8,5,4);
  X.fillStyle='rgba(60,100,140,0.35)';X.fillRect(cx2-5,cy-3,3,2);X.fillRect(cx2+3,cy-3,3,2);
  // Circular outline using 8 rects (cheaper than arc)
  X.fillStyle='rgba(100,160,200,0.35)';
  X.fillRect(cx2-15,cy-4,2,8);X.fillRect(cx2+13,cy-4,2,8);X.fillRect(cx2-4,cy-15,8,2);X.fillRect(cx2-4,cy+13,8,2);
  X.fillRect(cx2-12,cy-10,2,4);X.fillRect(cx2+10,cy-10,2,4);X.fillRect(cx2-12,cy+6,2,4);X.fillRect(cx2+10,cy+6,2,4);
}

let LV=null,P={x:0,y:0,vx:0,vy:0,w:30,h:28,dir:1,gnd:false,fr:0,inv:0,dead:false},cam={x:0,y:0};
function startLv(i){cl=i;biome=LEVELS[i].bio;LV=genLv(i);terrainDirty=true;P.x=2*T;P.y=14*T;P.vx=0;P.vy=0;P.dir=1;P.gnd=false;P.fr=0;P.inv=0;P.dead=false;keys=0;hp=mhp;pts=[];ftx=[];grenades=[];cam.x=P.x-400;cam.y=0;gt=300;tf=0;
  if(LV.boss){bossHp=bossMax;bootState='ground';bootTimer=90;bossX=65*T;bossY=16*T;bossVx=0;bossVy=0}
  gs='intro';lit=100}
function startGame(){lives=5;score=0;gems=0;hp=mhp;keys=0;startLv(0)}
function solid2(wx,wy){const tx=Math.floor(wx/T),ty=Math.floor(wy/T);if(tx<0||tx>=LV.pw||ty<0||ty>=LV.ph)return 0;const v=LV.grid[ty][tx];return v>0&&v!==2?1:0}// breakable(2) is solid too
function solidAny(wx,wy){const tx=Math.floor(wx/T),ty=Math.floor(wy/T);if(tx<0||tx>=LV.pw||ty<0||ty>=LV.ph)return 0;return LV.grid[ty][tx]>0?1:0}
function rOvr(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

// Break blocks near a point
function breakNear(tx2){for(let y=0;y<LV.ph;y++){if(LV.grid[y][tx2]===2){LV.grid[y][tx2]=0;spP(tx2*T+16,y*T+16,'#C0984C',4)}}terrainDirty=true}

function updPlayer(){
  if(P.dead)return;const sp=inp.ShiftLeft||inp.ShiftRight?WS:RS;
  if(inp.ArrowLeft){P.vx=-sp;P.dir=-1;P.fr++}else if(inp.ArrowRight){P.vx=sp;P.dir=1;P.fr++}else{P.vx*=.7;if(Math.abs(P.vx)<.1)P.vx=0}
  if((inp.ArrowUp||inp.Space)&&P.gnd){P.vy=JF;P.gnd=false;sfx('jump')}
  P.vy+=GR;if(P.vy>12)P.vy=12;const m=4,nx=P.x+P.vx;
  if(P.vx<0){if(solidAny(nx+m,P.y+4)||solidAny(nx+m,P.y+P.h-4)){P.x=Math.floor((nx+m)/T)*T+T-m;P.vx=0}else P.x=nx}
  else if(P.vx>0){if(solidAny(nx+P.w-m,P.y+4)||solidAny(nx+P.w-m,P.y+P.h-4)){P.x=Math.floor((nx+P.w-m)/T)*T-P.w+m;P.vx=0}else P.x=nx}
  const ny=P.y+P.vy;P.gnd=false;
  if(P.vy>0){if(solidAny(P.x+m,ny+P.h)||solidAny(P.x+P.w-m,ny+P.h)){P.y=Math.floor((ny+P.h)/T)*T-P.h;P.vy=0;P.gnd=true}else P.y=ny}
  else if(P.vy<0){if(solidAny(P.x+m,ny)||solidAny(P.x+P.w-m,ny)){P.y=Math.floor(ny/T)*T+T;P.vy=0}else P.y=ny}
  // Fall into pit or water
  if(LV.waterY&&P.y+P.h>LV.waterY*T){sfx('splash');pDie()}
  else if(P.y>LV.ph*T+64)pDie();
  if(P.inv>0)P.inv--;
  tf++;if(tf>=60){tf=0;gt--;if(gt<=0)pDie()}
  // Boss collision handled in updEnts
}
function pHit(){if(P.inv>0)return;hp--;P.inv=90;sht=12;shi=4;sfx('hurt');if(hp<=0)pDie()}
function pDie(){P.dead=true;lives--;sfx('die');setTimeout(()=>{if(lives<=0)gs='over';else startLv(cl)},1500)}

function updEnts(){
  const pr={x:P.x+4,y:P.y,w:P.w-8,h:P.h};
  LV.ents.forEach(e=>{
    if(e.alive&&(e.type==='frog'||e.type==='snake'||e.type==='bandit'||e.type==='bird')){
      const sp=e.type==='snake'?1.5:e.type==='bird'?1.2:.8;
      e.x+=e.dir*sp/T;if(e.x<=e.startX){e.x=e.startX;e.dir=1}if(e.x>=e.endX){e.x=e.endX;e.dir=-1}
      // Bird flies in sine wave
      if(e.type==='bird')e.y=e.baseY+Math.sin(fc*.04)*2;
      // Bandit throws grenades
      if(e.type==='bandit'){
        e.throwTimer--;
        if(e.throwTimer<=0&&!P.dead){
          e.throwTimer=100+Math.random()*80;
          const dx=P.x-e.x*T,dist=Math.abs(dx);
          if(dist<300){grenades.push({x:e.x*T+16,y:e.y*T+8,vx:dx*.015,vy:-5,life:120})}
        }
      }
      if(!P.dead&&P.inv<=0){
        const ew=e.type==='snake'?80:e.type==='bird'?24:T;
        const er={x:e.x*T,y:e.y*T,w:ew,h:T};
        if(rOvr(pr,er)){
          if(P.vy>0&&P.y+P.h<er.y+er.h*.6){
            P.vy=JF*.6;sfx('stomp');e.alive=false;spP(e.x*T+16,e.y*T,'#FF6B6B',6);score+=100;spT(e.x*T,e.y*T-16,'+100','#FFD700');
          }else pHit();
        }
      }
    }
    if(e.type==='bubble'&&e.alive&&!P.dead){const bx=e.x*T,by=e.y*T+Math.sin(fc*.03+e.x*.08)*8;if(rOvr(pr,{x:bx+2,y:by+2,w:28,h:28})){e.alive=false;score+=50;gems++;spP(bx+16,by+16,'#88CCFF',5);spT(bx+8,by-4,'+50','#88DDFF');sfx('gem')}}
    // Detonator
    if(e.type==='detonator'&&e.alive&&rOvr(pr,{x:e.x*T,y:e.y*T,w:T,h:T})){
      if(P.vy>0&&P.y+P.h<e.y*T+T*.6){P.vy=JF*.6;sfx('boom');e.alive=false;spP(e.x*T+16,e.y*T,'#FF8800',12);score+=200;spT(e.x*T,e.y*T-20,'BOOM!','#FF6B00');if(e.twx!==undefined)breakNear(e.twx)}
    }
    // Boss
    if(e.type==='boss'&&e.alive&&bossHp>0){
      // Hopping boot mech AI - seeks the pig!
      bootTimer--;
      const arenaLeft=50*T,arenaRight=78*T,arenaGnd=16*T;
      if(bootState==='ground'){
        // Sitting on ground - vulnerable! Wait then jump toward pig
        if(bootTimer<=0){
          bootState='jump';
          // Jump toward pig
          const dx=P.x-bossX;
          bossVx=Math.max(-4,Math.min(4,dx*.03));
          bossVy=-10-Math.random()*3;
          bootTimer=60;
          sfx('boss');
        }
      } else if(bootState==='jump'){
        // In the air - spikes are deadly!
        bossVy+=.4;
        bossX+=bossVx;
        bossY+=bossVy;
        // Clamp to arena
        bossX=Math.max(arenaLeft+30,Math.min(arenaRight-30,bossX));
        // Land on ground
        if(bossY>=arenaGnd){
          bossY=arenaGnd;bossVy=0;bossVx=0;
          bootState='ground';bootTimer=50+Math.random()*40;
          sht=8;shi=4;sfx('boom');
          spP(bossX,bossY,'#888',8);
          // Damage pig if close when landing (shockwave)
          if(!P.dead&&P.inv<=0&&Math.abs(P.x+15-bossX)<50&&P.y+P.h>arenaGnd-10)pHit();
        }
        // Spike damage while in air
        if(!P.dead&&P.inv<=0){
          const spikeR={x:bossX-28,y:bossY,w:56,h:14};
          if(rOvr(pr,spikeR))pHit();
        }
      }
      // Stomp the villain's HEAD on top of the boot (only when grounded!)
      if(bootState==='ground'&&!P.dead&&P.inv<=0){
        const headR={x:bossX-8,y:bossY-55,w:16,h:14};
        if(rOvr(pr,headR)&&P.vy>0&&P.y+P.h<headR.y+10){
          P.vy=JF*.8;sfx('stomp');bossHp--;sht=15;shi=8;
          spP(bossX,bossY-50,'#FFD700',12);
          if(bossHp<=0){
            e.alive=false;score+=1000;
            spT(bossX-30,bossY-70,'BOSS DEFEATED!','#FFD700');sfx('clear');
            // Remove arena wall so pig can reach door
            for(let yy=0;yy<LV.ph;yy++)if(LV.grid[yy]&&LV.grid[yy][80])LV.grid[yy][80]=0;
            terrainDirty=true;
          } else {
            spT(bossX-20,bossY-70,bossHp+' HITS LEFT','#FF6B6B');
            // Boss gets angry - jump immediately
            bootState='jump';bossVx=(Math.random()-.5)*6;bossVy=-12;bootTimer=60;
          }
        }
        // Body collision (not head) hurts pig
        else if(rOvr(pr,{x:bossX-26,y:bossY-42,w:52,h:44}))pHit();
      }
    }
    // Collectibles
    if(e.collected)return;const er={x:e.x*T,y:e.y*T,w:T,h:T};
    if(e.type==='gem'&&rOvr(pr,er)){e.collected=true;gems++;score+=100;spP(e.x*T+16,e.y*T+16,'#4488CC',5);spT(e.x*T,e.y*T-10,'+100','#5599DD');sfx('gem')}
    if(e.type==='key'&&rOvr(pr,er)){e.collected=true;keys++;spP(e.x*T+16,e.y*T+16,'#FFD700',8);spT(e.x*T,e.y*T-10,'KEY!','#FFD700');sfx('key')}
    if(e.type==='heart'&&rOvr(pr,er)){e.collected=true;if(hp<mhp)hp++;spP(e.x*T+16,e.y*T+16,'#E53935',5);sfx('gem')}
    if(e.type==='door'){const dr={x:e.x*T-4,y:e.y*T-54,w:40,h:58};
      if(rOvr(pr,dr)){
        // Boss level: must defeat boss first
        if(LV.boss&&bossHp>0){if(fc%60===0)spT(e.x*T-12,e.y*T-60,'Defeat boss!','#FF6B6B');return}
        if(keys>=LV.kn){sfx('clear');gs='complete';if(cl<11)setTimeout(()=>startLv(cl+1),1200);else setTimeout(()=>{gs='win'},1200)}
        else if(fc%60===0)spT(e.x*T-12,e.y*T-60,'Need key!','#FF6B6B')}}
  });
  // Grenades
  grenades=grenades.filter(g2=>{g2.x+=g2.vx;g2.y+=g2.vy;g2.vy+=.2;g2.life--;
    if(solidAny(g2.x,g2.y)||g2.y>LV.ph*T){spP(g2.x,g2.y,'#FF8800',6);sfx('boom');
      if(!P.dead&&P.inv<=0&&Math.abs(g2.x-P.x-15)<40&&Math.abs(g2.y-P.y-14)<40)pHit();return false}
    if(!P.dead&&P.inv<=0&&Math.abs(g2.x-P.x-15)<20&&Math.abs(g2.y-P.y-14)<20){pHit();spP(g2.x,g2.y,'#FF8800',6);sfx('boom');return false}
    return g2.life>0});
  // Boulders
  LV.boulders.forEach(b=>{
    if(b.vx!==0){b.x+=b.vx;b.vy+=.3;b.y+=b.vy;
      if(solidAny(b.x,b.y+b.r+2)){b.y=Math.floor((b.y+b.r+2)/T)*T-b.r-2;b.vy=0;b.grounded=true}else b.grounded=false}
    if(!P.dead&&P.inv<=0){const dx=b.x-P.x-15,dy=b.y-P.y-14,dist=Math.sqrt(dx*dx+dy*dy);if(dist<b.r+12)pHit()}
  });
}

function updCam(){const tx=P.x-350,ty=Math.min(P.y-250,0);cam.x+=(tx-cam.x)*.08;cam.y+=(ty-cam.y)*.08;cam.x=Math.max(0,Math.min(cam.x,LV.pw*T-800));cam.y=Math.max(-(LV.ph*T-600),Math.min(cam.y,0))}

// ═══════════════════ RENDER ═══════════════════
function renderPlay(){
  X.save();if(sht>0){X.translate((Math.random()-.5)*shi,(Math.random()-.5)*shi);sht--}
  drawBG(cam.x,LV.rain);X.save();X.translate(-Math.floor(cam.x),-Math.floor(cam.y));
  LV.decs.forEach(d=>{if(d.x<cam.x-100||d.x>cam.x+900)return;
    if(d.type==='wall')drawWall(d.x,d.y,d.w,d.h,d.color);if(d.type==='win')drawWindow(d.x,d.y);
    if(d.type==='cactus')drawCactus(d.x,d.y);if(d.type==='bush')drawBush(d.x,d.y);if(d.type==='rock')drawRock(d.x,d.y);if(d.type==='plant')drawPlant(d.x,d.y)});
  drawTerrain(LV.grid,LV.pw,LV.ph,cam.x,cam.y);
  LV.crates.forEach(c=>{if(c.x>cam.x-40&&c.x<cam.x+840)drawCrate(c.x,c.y)});
  LV.bridges.forEach(b=>{if(b.x+b.w>cam.x-40&&b.x<cam.x+840)drawBridge(b.x,b.y,b.w)});
  // Boulders
  LV.boulders.forEach(b=>{if(b.x>cam.x-40&&b.x<cam.x+840)drawBoulder(b.x,b.y,b.r)});
  // Entities
  LV.ents.forEach(e=>{const ex=e.x*T,ey=e.y*T;if(ex<cam.x-80||ex>cam.x+880)return;
    if(e.type==='gem'&&!e.collected)drawGem(ex,ey,fc);if(e.type==='key'&&!e.collected)drawKeyItem(ex,ey,fc);
    if(e.type==='heart'&&!e.collected)drawHeart(ex+8,ey+8+Math.sin(fc*.06)*2,true);
    if(e.type==='door')drawDoorExit(ex,ey,keys<LV.kn);if(e.type==='frog'&&e.alive)drawFrog(ex,ey,fc,e.dir);
    if(e.type==='snake'&&e.alive)drawSnake(ex,ey,fc,e.dir);if(e.type==='bubble'&&e.alive)drawBubble(ex,ey,fc);
    if(e.type==='bandit'&&e.alive)drawBandit(ex,ey,fc,e.dir);
    if(e.type==='bird'&&e.alive)drawBird(ex,ey,fc);
    if(e.type==='detonator'&&e.alive){drawCrate(ex,ey);X.fillStyle='#FFD700';X.fillRect(ex+12,ey-4,8,6);X.fillStyle='#FF6B00';X.fillRect(ex+14,ey-2,4,3)}
    if(e.type==='boss'&&e.alive)drawBoss();
  });
  // Grenades
  grenades.forEach(g2=>drawGrenade(g2.x,g2.y));
  // Water
  if(LV.waterY)drawWater(LV.waterY*T-Math.floor(cam.y),cam.x);
  // Player
  if(!P.dead){if(P.inv<=0||Math.floor(P.inv/4)%2===0)drawPig(P.x,P.y,P.dir,P.fr,P.gnd)}
  else{X.save();X.translate(P.x+16,P.y+14);X.rotate(fc*.2);drawPig(-16,-14,1,0,false);X.restore()}
  pts.forEach(p=>{X.globalAlpha=p.l/p.ml;X.fillStyle=p.c;X.fillRect(Math.floor(p.x),Math.floor(p.y),p.s,p.s)});X.globalAlpha=1;
  ftx.forEach(f=>{X.globalAlpha=f.l/50;X.fillStyle=f.c;X.font='8px "Press Start 2P",monospace';X.fillText(f.t,f.x,f.y)});X.globalAlpha=1;
  X.restore();
  // HUD
  X.fillStyle='rgba(0,0,0,0.55)';X.fillRect(0,0,800,36);X.fillStyle='#5D4037';X.fillRect(0,36,800,2);
  X.fillStyle='#E0C898';X.fillRect(8,7,12,9);X.fillStyle='#604020';X.fillRect(16,10,2,2);
  X.fillStyle='#fff';X.font='9px "Press Start 2P",monospace';X.fillText('x'+lives,26,17);
  X.fillStyle='#1A4466';X.fillRect(74,5,7,14);X.fillStyle='#336699';X.fillRect(75,6,5,12);X.fillStyle='#5599DD';X.fillRect(76,7,3,10);
  X.fillStyle='#fff';X.fillText('x'+String(gems).padStart(2,'0'),88,17);X.fillText(String(score).padStart(7,'0'),160,17);
  X.fillStyle='#6699AA';X.beginPath();X.arc(310,13,7,0,Math.PI*2);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(310,13,5,0,Math.PI*2);X.fill();X.fillStyle='#000';X.fillRect(309,10,2,4);X.fillRect(309,13,3,1);
  X.fillStyle='#fff';X.fillText(String(gt),325,17);for(let i=0;i<mhp;i++)drawHeart(8+i*18,21,i<hp);
  X.fillStyle='#888';X.font='7px "Press Start 2P",monospace';X.fillText('LV'+(cl+1)+'/12',700,16);
  if(gs==='pause'){X.fillStyle='rgba(0,0,0,0.6)';X.fillRect(0,0,800,600);X.fillStyle='#FFD700';X.font='26px "Press Start 2P",monospace';X.textAlign='center';X.fillText('PAUSED',400,280);X.fillStyle='#E8C872';X.font='9px "Press Start 2P",monospace';X.fillText('Press P to resume',400,310);X.textAlign='left'}
  X.restore();
}

// ═══════════════════ SCREENS ═══════════════════
function renderTitle(){
  biome='desert';drawBG(fc*.3);
  const tg=Array.from({length:22},()=>Array(25).fill(0));for(let y=15;y<22;y++)for(let x=0;x<25;x++)tg[y][x]=1;drawTerrain(tg,25,22,0,0);
  X.fillStyle='#D0A858';X.fillRect(30,300,140,180);X.fillStyle='#C09848';for(let y=300;y<480;y+=5)X.fillRect(30,y,140,1);
  X.fillStyle='#8B6914';X.fillRect(20,290,170,10);X.fillStyle='#C4941E';X.fillRect(50,300,8,180);X.fillRect(140,300,8,180);
  X.fillStyle='#5D4037';X.fillRect(78,380,50,100);X.fillStyle='#8B7355';X.fillRect(82,384,42,92);drawWindow(44,330);drawWindow(128,330);
  drawCactus(580,15*T);drawBush(400,15*T);drawPig(290,448,1,fc,true);drawRock(480,15*T);

  X.fillStyle='#E8C872';X.fillText('SAVE THE',400,79);X.fillText('SHERIFF',400,112);
  X.fillStyle='#FFD700';X.fillText('SAVE THE',399,78);X.fillText('SHERIFF',399,111);
  [{t:'NEW GAME',y:165},{t:'HOW TO PLAY',y:205}].forEach(b=>{const h=mY>=b.y-13&&mY<=b.y+13&&mX>=295&&mX<=505;X.fillStyle=h?'#A67B1A':'#8B6914';X.fillRect(295,b.y-13,210,26);X.fillStyle=h?'#C4941E':'#A67B1A';X.fillRect(299,b.y-9,202,18);X.strokeStyle='#5D4037';X.lineWidth=2;X.strokeRect(295,b.y-13,210,26);X.fillStyle='#fff';X.font='9px "Press Start 2P",monospace';X.fillText(b.t,400,b.y+3)});
  // Level select
  X.fillStyle='rgba(0,0,0,0.5)';X.fillRect(190,236,420,120);X.fillStyle='#E8C872';X.font='8px "Press Start 2P",monospace';X.fillText('SELECT LEVEL',400,254);
  for(let i=0;i<12;i++){const col=i%6,row=Math.floor(i/6);const bx=205+col*66,by=261+row*42;const hov=mX>=bx&&mX<=bx+56&&mY>=by&&mY<=by+32;X.fillStyle=hov?'#A67B1A':'#6B4820';X.fillRect(bx,by,56,32);X.fillStyle=hov?'#C4941E':'#8B6914';X.fillRect(bx+2,by+2,52,28);X.fillStyle='#fff';X.font='7px "Press Start 2P",monospace';X.fillText(''+(i+1),bx+28,by+13);X.fillStyle='#ccc';X.font='5px "Press Start 2P",monospace';X.fillText(LEVELS[i].name.substring(0,8),bx+28,by+24)}
  X.fillStyle='rgba(255,255,255,0.3)';X.font='6px "Press Start 2P",monospace';X.fillText('12 Levels - Boss Fight - Rescue the Sheriff!',400,590);X.textAlign='left';
}
function renderHowTo(){biome='desert';drawBG(0);const tg=Array.from({length:22},()=>Array(25).fill(0));for(let y=16;y<22;y++)for(let x=0;x<25;x++)tg[y][x]=1;drawTerrain(tg,25,22,0,0);X.textAlign='center';X.fillStyle='#FFD700';X.font='20px "Press Start 2P",monospace';X.fillText('HOW TO PLAY',400,40);X.fillStyle='rgba(0,0,0,0.5)';X.fillRect(70,55,660,390);X.fillStyle='#E8C872';X.font='10px "Press Start 2P",monospace';X.fillText('CONTROLS',400,82);const dk=(x,y,l,w=42)=>{X.fillStyle='#ddd';X.fillRect(x,y,w,26);X.fillStyle='#eee';X.fillRect(x+2,y+2,w-4,20);X.fillStyle='#333';X.font='8px "Press Start 2P",monospace';X.fillText(l,x+w/2,y+16)};dk(375,95,'\u2191');dk(325,128,'\u2190');dk(375,128,'\u2193');dk(425,128,'\u2192');X.fillStyle='#fff';X.font='7px "Press Start 2P",monospace';X.fillText('MOVE & JUMP',375,170);dk(170,110,'SHIFT',60);X.fillStyle='#fff';X.fillText('WALK',200,155);dk(530,105,'P');X.fillStyle='#fff';X.fillText('PAUSE',555,140);X.fillStyle='#E8C872';X.font='10px "Press Start 2P",monospace';X.fillText('RULES',400,200);X.fillStyle='#fff';X.font='7px "Press Start 2P",monospace';['Stomp enemies! Dodge grenades!','Collect blue gems for 100 points','Find a key to unlock the exit','Stomp detonators to blast walls','Avoid bubbles and boulders!','Defeat the BOSS to save the Sheriff!'].forEach((r,i)=>X.fillText('> '+r,400,225+i*20));const h=mY>=385&&mY<=411&&mX>=330&&mX<=470;X.fillStyle=h?'#A67B1A':'#8B6914';X.fillRect(330,385,140,26);X.fillStyle=h?'#C4941E':'#A67B1A';X.fillRect(334,389,132,18);X.strokeStyle='#5D4037';X.lineWidth=2;X.strokeRect(330,385,140,26);X.fillStyle='#fff';X.font='9px "Press Start 2P",monospace';X.fillText('BACK',400,403);X.textAlign='left'}
function renderIntro(){drawBG(0,LEVELS[cl].rain);X.fillStyle='rgba(0,0,0,0.7)';X.fillRect(0,0,800,600);X.textAlign='center';X.fillStyle='#888';X.font='10px "Press Start 2P",monospace';X.fillText('WORLD '+Math.floor(cl/3+1),400,200);X.fillStyle='#E8C872';X.font='15px "Press Start 2P",monospace';X.fillText('LEVEL '+(cl+1),400,230);X.fillStyle='#FFD700';X.font='18px "Press Start 2P",monospace';X.fillText(LEVELS[cl].name.toUpperCase(),400,264);drawPig(384,310,1,fc,true);X.fillStyle='#fff';X.beginPath();X.arc(420,300,10,0,Math.PI*2);X.fill();X.fillRect(414,310,4,3);X.beginPath();X.arc(413,316,2,0,Math.PI*2);X.fill();X.fillStyle='#FFD4A8';X.fillRect(415,294,10,10);X.fillStyle='#8B6914';X.fillRect(413,290,14,5);X.fillStyle='#000';X.fillRect(418,298,2,2);X.fillRect(422,298,2,2);X.fillStyle='#aaa';X.font='8px "Press Start 2P",monospace';if(cl===11)X.fillText('Defeat the boss! Save the Sheriff!',400,370);else if(cl===8)X.fillText('Watch out for the water!',400,370);else X.fillText('Find the key to exit!',400,370);X.textAlign='left'}
function renderOver(){drawBG(0);X.fillStyle='rgba(0,0,0,0.8)';X.fillRect(0,0,800,600);X.textAlign='center';X.fillStyle='#C41E3A';X.font='32px "Press Start 2P",monospace';X.fillText('GAME OVER',400,170);X.fillStyle='#E8C872';X.font='10px "Press Start 2P",monospace';X.fillText('FINAL SCORE',400,225);X.fillStyle='#FFD700';X.font='16px "Press Start 2P",monospace';X.fillText(String(score).padStart(8,'0'),400,252);X.fillStyle='#fff';X.font='8px "Press Start 2P",monospace';X.fillText('Gems: '+gems+'  Level: '+(cl+1)+'/12',400,282);drawPig(384,310,1,0,true);const h=mY>=370&&mY<=396&&mX>=295&&mX<=505;X.fillStyle=h?'#A67B1A':'#8B6914';X.fillRect(295,370,210,26);X.fillStyle=h?'#C4941E':'#A67B1A';X.fillRect(299,374,202,18);X.strokeStyle='#5D4037';X.lineWidth=2;X.strokeRect(295,370,210,26);X.fillStyle='#fff';X.font='9px "Press Start 2P",monospace';X.fillText('TRY AGAIN',400,388);X.textAlign='left'}

// Victory: Sheriff rescue in wooden room!
function renderWin(){
  // Wooden wall background (vertical planks)
  X.fillStyle='#C8A060';X.fillRect(0,0,800,480);
  for(let lx=0;lx<800;lx+=12){X.fillStyle=lx%24<12?'#C09850':'#B89048';X.fillRect(lx,0,12,480)}

  X.fillStyle='#5BAE4A';X.fillRect(0,480,800,120);X.fillStyle='#4D9A3E';for(let y=480;y<600;y+=5)X.fillRect(0,y,800,1);
  // Confetti
  if(fc%6===0)spP(200+Math.random()*400,80+Math.random()*200,['#FFD700','#E53935','#5BAE4A','#4488CC'][Math.floor(Math.random()*4)],3);
  pts.forEach(p=>{X.globalAlpha=p.l/p.ml;X.fillStyle=p.c;X.fillRect(Math.floor(p.x),Math.floor(p.y),p.s,p.s)});X.globalAlpha=1;

  X.fillStyle='#fff';X.font='8px "Press Start 2P",monospace';X.fillText('Gems: '+gems,400,278);
  const h=mY>=310&&mY<=336&&mX>=295&&mX<=505;
  X.fillStyle=h?'#A67B1A':'#8B6914';X.fillRect(295,310,210,26);X.fillStyle=h?'#C4941E':'#A67B1A';X.fillRect(299,314,202,18);X.strokeStyle='#5D4037';X.lineWidth=2;X.strokeRect(295,310,210,26);X.fillStyle='#fff';X.font='9px "Press Start 2P",monospace';X.fillText('PLAY AGAIN',400,328);X.textAlign='left';
}

let mX=0,mY=0;
C.addEventListener('mousemove',e=>{const r=C.getBoundingClientRect();mX=(e.clientX-r.left)*(800/r.width);mY=(e.clientY-r.top)*(600/r.height)});
function onClick(e){const r=C.getBoundingClientRect(),cx=(e.clientX-r.left)*(800/r.width),cy=(e.clientY-r.top)*(600/r.height);if(AC.state==='suspended')AC.resume();
  if(gs==='title'){if(cx>=295&&cx<=505){if(cy>=152&&cy<=178){sfx('sel');startGame()}if(cy>=192&&cy<=218){sfx('sel');gs='howto'}}
    for(let i=0;i<12;i++){const col=i%6,row=Math.floor(i/6);const bx=205+col*66,by=261+row*42;if(cx>=bx&&cx<=bx+56&&cy>=by&&cy<=by+32){sfx('sel');lives=5;score=0;gems=0;hp=mhp;keys=0;startLv(i);break}}}
  if(gs==='howto'&&cx>=330&&cx<=470&&cy>=385&&cy<=411){sfx('sel');gs='title'}
  if(gs==='over'&&cx>=295&&cx<=505&&cy>=370&&cy<=396){sfx('sel');startGame()}
  if(gs==='win'&&cx>=295&&cx<=505&&cy>=310&&cy<=336){sfx('sel');gs='title'}}

function loop(){fc++;X.clearRect(0,0,800,600);switch(gs){
  case'title':renderTitle();break;case'howto':renderHowTo();break;
  case'intro':lit--;renderIntro();if(lit<=0)gs='play';break;
  case'play':updPlayer();updEnts();updPts();updCam();renderPlay();if(inp.KeyQ){gs='title';inp.KeyQ=false}break;
  case'pause':renderPlay();break;
  case'complete':updPts();renderPlay();X.fillStyle='rgba(0,0,0,0.4)';X.fillRect(0,0,800,600);X.textAlign='center';X.fillStyle='#FFD700';X.font='20px "Press Start 2P",monospace';X.fillText('LEVEL CLEAR!',400,260);X.fillStyle='#fff';X.font='9px "Press Start 2P",monospace';X.fillText('Score: '+score,400,295);X.fillText('Level '+(cl+1)+'/12',400,315);X.textAlign='left';break;
  case'over':updPts();renderOver();break;case'win':updPts();renderWin();break}
  requestAnimationFrame(loop)}
loop();
